# 无模型调试配置：不加载模型、不需要显卡和 torch，用来调框架、协议和网页客户端。
# 模拟两张卡（两个 worker 进程），验证直播 / 离线任务的分卡调度。

models:
  backend: mock
  default_model: lite
  preload: [lite, pro]

gpu:
  devices: [0, 1]
  mode: multi_instance
  live_devices: [0]
  offline_devices: [1]
  stagger_start: false

mock:
  speed: {lite: 0.3, pro: 0.7}   # 改成 >1 可以模拟显卡跟不上时的补帧/卡顿

tts:
  engine: mock              # 不联网；想听真人声改成 edge
