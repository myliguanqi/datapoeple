# ============================================================
# 带货直播触发器表（结构与优先级思路移植自参考项目 douyin_zhibo 的 sheep_pk/triggers.yaml 平台部分）
#
# 「激情是算出来的，不是 LLM 即兴」：导演按信号挑触发器（谁先说、什么情绪、多高优先级），
# 主持人再用模板（lines）或 LLM（use_llm: true）把它说成口语；LLM 慢了/挂了一律用 lines 兜底，绝不冷场。
#
# 每条字段：
#   when          命中信号（平台信号见 live/interaction/signals.py 的 PLATFORM_SIGNALS；
#                 也可以写本模板 intents[] 里的意图名；always = 恒真兜底）
#   priority      优先级（高→低）；≥ interaction.urgent_priority 的不受发声间隔限制；
#                 ≥ host.interrupt_priority 的会打断正在讲的讲解段
#   emotion       中间情绪标签（引擎支持时影响语气）
#   target_energy 命中时把能量顶到多高（能量高 → 语速快、发声间隔短）
#   cooldown_s    同一触发器最短间隔
#   max_stale_s   在队列里等太久就不说了（不填用 interaction.max_stale_s）
#   use_llm       是否让 LLM 写词（false = 直接用 lines，最快、零成本）
#   role / merge_clause / merge_with   同拍合并：who（点名人）+ what（场面）合成一句
#   directive     给 LLM 的指令
#   lines         兜底话术（随机挑一条，避开最近说过的）；{占位符} 见 director._fmt
#
# Web「人设 → 触发器」可以改开关/优先级/冷却/话术（写进当前人设模板，热更新；出厂模板只读，先复制）。
# 所有话术都要过合规过滤（compliance.*），这里本身也不写极限词。字段说明见 docs/live/PERSONAS.md。
# ============================================================

gift_l:
  when: gift_l
  priority: 63
  emotion: 感激高能
  target_energy: 0.95
  cooldown_s: 0
  max_stale_s: 90
  use_llm: false
  role: who
  directive: "重磅礼物到账：隆重点名感谢，必须说出谁送了几个什么礼物（礼物名原样说），夸排面，再顺势带一句今天的好物；不承诺任何回报"
  lines:
    - "哇！感谢{gift_user}送的{gift_count}个{gift_name}！{gift_honor}这排面直接拉满了，家人们给{gift_honor}点点关注！"
    - "{gift_user}送了{gift_count}个{gift_name}，太感谢了！{gift_honor}今天必须好好给您介绍咱家宝贝！"
    - "感谢{gift_user}的{gift_name}{gift_count}个！主播记住您了，{gift_honor}有想了解的随时打在公屏上！"

