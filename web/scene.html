<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>直播画面 · FlashHead</title>
  <link rel="icon" href="data:,">
  <style>
    /* 直播场景页：给 OBS 浏览器源用（宽高设成画布尺寸，默认 720×1280）。画布按窗口等比缩放，居中。 */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #fff; }
    #fit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; flex: none; overflow: hidden; transform-origin: center center;
      background: radial-gradient(120% 80% at 50% 20%, #2a3346 0%, #12161f 60%, #07090d 100%); background-size: cover; background-position: center; }
    .layer { position: absolute; }
    #video { background: #000; object-fit: contain; display: none; }
    .dh { overflow: hidden; transition: left .35s, top .35s, width .35s, height .35s; }
    .dh canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
    .dh.pip { border-radius: 18px; box-shadow: 0 6px 24px rgba(0, 0, 0, .6); border: 3px solid rgba(255, 255, 255, .85); background: #000; }
    .card { box-sizing: border-box; overflow: hidden; padding: 22px 28px; border-radius: 22px; background: rgba(12, 16, 24, .78);
      border: 1px solid rgba(255, 255, 255, .18); box-shadow: 0 8px 30px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); }
    .card .name { font-size: 40px; font-weight: 700; line-height: 1.25; }
    .card .price { margin-top: 10px; font-size: 32px; font-weight: 700; color: #ffd24d; }
    .card ul { margin: 12px 0 0; padding: 0; list-style: none; font-size: 26px; line-height: 1.5; color: #e6e9ef; }
    .card li::before { content: "✓ "; color: #6ee7a8; }
    .card.compact ul { display: none; }
    .subtitle { left: 5%; right: 5%; text-align: center; font-size: 34px; font-weight: 600; line-height: 1.4;
      text-shadow: 0 2px 4px #000, 0 0 12px #000; }
    .disclosure { left: 20px; top: 20px; padding: 6px 16px; border-radius: 999px; font-size: 22px; background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(255, 255, 255, .35); z-index: 50; white-space: nowrap; }
    .overlay { inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px;
      font-size: 34px; background: rgba(0, 0, 0, .6); z-index: 60; cursor: pointer; }
    .debug { right: 10px; bottom: 10px; max-width: 70%; padding: 8px 12px; font: 18px/1.4 ui-monospace, Consolas, monospace;
      background: rgba(0, 0, 0, .7); color: #9fe; z-index: 70; white-space: pre-wrap; }
    body.debug .dh, body.debug .card, body.debug #video { outline: 3px dashed #0ff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <video id="video" class="layer" playsinline preload="auto"></video>
    <div id="dh" class="layer dh"><canvas id="dhCanvas" width="512" height="512"></canvas></div>
    <div id="card" class="layer card" hidden><div class="name"></div><div class="price"></div><ul></ul></div>
    <div id="subtitle" class="layer subtitle"></div>
    <div id="disclosure" class="layer disclosure">本直播间为 AI 数字人直播</div>
    <div id="debug" class="layer debug" hidden></div>
    <div id="overlay" class="layer overlay">连接中…</div>
  </div>
</div>
<script type="module" src="/web/scene.js"></script>
</body>
</html>
