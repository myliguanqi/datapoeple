<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashHead 数字人直播</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header class="topbar" id="topbar">
  <h1>FlashHead 数字人直播</h1>
  <div class="pills">
    <span class="pill" id="pillSession" title="直播会话">会话 —</span>
    <span class="pill" id="pillDanmaku" title="弹幕连接">弹幕 —</span>
    <span class="pill" id="pillTts" title="语音合成">TTS —</span>
    <span class="pill" id="pillLlm" title="大模型">LLM —</span>
    <span class="pill plain" id="pillRtf" title="生成耗时 / 块时长，小于 1 才能实时">RTF —</span>
  </div>
  <div class="tools">
    <select id="sessionSelect" title="当前会话"></select>
    <button class="small" id="tokenBtn" type="button" title="管理口令（写操作需要）">口令</button>
    <button class="small" id="themeBtn" type="button" title="切换亮/暗主题">主题</button>
  </div>
</header>
<div class="shell">
  <aside class="sidebar">
    <nav id="nav">
      <a href="#/console" data-page="console">直播控制台</a>
      <a href="#/danmaku" data-page="danmaku">弹幕互动</a>
      <a href="#/products" data-page="products">产品与知识库</a>
      <a href="#/media" data-page="media">视频素材</a>
      <a href="#/settings" data-page="settings">直播间设置</a>
      <a href="#/system" data-page="system">数字人与系统</a>
      <a href="#/offline" data-page="offline">离线视频</a>
      <select id="navSelect" aria-label="页面"></select>
    </nav>
  </aside>
  <main class="page" id="page"></main>
</div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
